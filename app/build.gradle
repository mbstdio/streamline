plugins { id 'com.android.application' }

def signingProperties = new Properties()
def signingPropertiesFile = new File(gradle.gradleUserHomeDir, 'streamline-signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { name -> System.getenv(name) ?: signingProperties.getProperty(name) }

android {
    namespace 'tv.streamline.app'
    compileSdk 35
    defaultConfig {
        applicationId 'tv.streamline.app'
        minSdk 30
        targetSdk 34
        versionCode 8
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            def keystore = signingValue('STREAMLINE_KEYSTORE')
            if (keystore) storeFile file(keystore)
            storePassword signingValue('STREAMLINE_STORE_PASSWORD')
            keyAlias signingValue('STREAMLINE_KEY_ALIAS') ?: 'streamline'
            keyPassword signingValue('STREAMLINE_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
